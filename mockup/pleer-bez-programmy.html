<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плеер Plixus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Макет: слева плеер с дорожками каналов, справа выбор записи и список каналов. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --stage: #f4f6f9;
  --line: #d3dae3;
  --fg: #18212c;
  --muted: #5d6b7c;
  --hover: #edf1f6;
  --danger: #c0352b;
  --c1: #2f6fd6;
  --c2: #d4412f;
  --c3: #15935a;
  --c4: #5a55d2;
  --c5: #b9800f;
  --c6: #1b8ca6;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-time: "IBM Plex Mono", Consolas, monospace;
  --lw: 72px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141b;
    --panel: #171e27;
    --stage: #121820;
    --line: #2b3542;
    --fg: #e8edf3;
    --muted: #94a2b3;
    --hover: #212a35;
    --danger: #f0705f;
    --c1: #6b9cf0;
    --c2: #f0705f;
    --c3: #3dc486;
    --c4: #9490f2;
    --c5: #e0aa3e;
    --c6: #4cbcd6;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  padding: 16px;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  min-height: 540px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

/* Плеер */
.player { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.stage {
  flex: 1;
  min-height: 220px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 48px 16px;
  background: var(--stage);
  text-align: center;
}
.conn { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn[data-state="ok"]::before { background: var(--c3); }
.conn[data-state="error"] { color: var(--danger); }
.conn[data-state="error"]::before { background: var(--danger); }
.stage-label { color: var(--muted); font-size: 14px; }
.stage-name { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 600; line-height: 1.15; }
.stage-name i { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--muted)); }
.stage-time { font-family: var(--font-time); font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Дорожки */
.timeline { padding: 14px 16px 8px; border-top: 1px solid var(--line); }
.lanes { position: relative; display: grid; gap: 6px; cursor: pointer; touch-action: none; user-select: none; }
.lanes.empty { cursor: default; }
.lane { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); gap: 10px; align-items: center; transition: opacity .15s; }
.lane.dim { opacity: .3; }
.lane-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-track { position: relative; height: 8px; background: var(--hover); border-radius: 2px; }
.lane-bar { position: absolute; top: 0; bottom: 0; left: 0; background: var(--c); border-radius: 2px; }
.lane-empty { font-size: 13px; color: var(--muted); padding: 4px 0 4px calc(var(--lw) + 10px); }
.playhead-area { position: absolute; top: -4px; bottom: -4px; left: calc(var(--lw) + 10px); right: 0; pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); }
.ticks { position: relative; height: 18px; margin: 6px 0 0 calc(var(--lw) + 10px); font-family: var(--font-time); font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }

/* Панель кнопок */
.controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "time transport actions";
  align-items: center;
  gap: 12px 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
}
.clock { grid-area: time; font-family: var(--font-time); font-variant-numeric: tabular-nums; }
.clock span { color: var(--muted); }
.transport { grid-area: transport; display: flex; align-items: center; gap: 12px; }
.actions { grid-area: actions; display: flex; justify-content: flex-end; gap: 8px; }

.icon-btn {
  min-width: 44px; height: 44px;
  display: grid; place-items: center;
  padding: 0 6px;
  background: none; border: 0; border-radius: 6px;
}
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn:disabled { color: var(--line); }
.skip { font-family: var(--font-time); font-size: 14px; font-weight: 500; }
.play {
  width: 56px; height: 56px;
  display: grid; place-items: center;
  background: var(--fg); color: var(--panel);
  border: 0; border-radius: 50%;
}
.play:disabled { opacity: .35; }
.play svg { fill: currentColor; stroke: none; width: 26px; height: 26px; }

.btn {
  height: 40px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 14px; font-weight: 500;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 18px; height: 18px; }

/* Колонка справа */
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.filters { display: grid; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 8px; }
.field select { width: 100%; min-width: 0; height: 40px; padding: 0 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.square { width: 40px; padding: 0; }
.channels { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.row {
  width: 100%;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 8px;
  background: none; border: 0; border-radius: 4px;
  text-align: left;
}
.row:hover { background: var(--hover); }
.row[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 600; }
.row i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.row b { font-weight: inherit; overflow-wrap: anywhere; }
.row time, .row small { font-family: var(--font-time); font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.row small { font-family: var(--font-ui); color: var(--danger); }
.note { margin: 0; padding: 12px 8px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.side-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.side-nav p { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 1080px) {
  .controls { grid-template-columns: auto 1fr; grid-template-areas: "transport transport" "time actions"; }
  .transport { justify-self: center; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .player { border-right: 0; border-bottom: 1px solid var(--line); }
  .channels { overflow: visible; }
  .stage-name { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { .lane { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <section class="player" aria-label="Плеер">
    <div class="stage">
      <span class="conn" id="conn">Подключение…</span>
      <span class="stage-label" id="recTitle">Запись не выбрана</span>
      <div class="stage-name" id="stageName"><i></i><span>Все каналы</span></div>
      <div class="stage-time" id="stageTime"></div>
    </div>

    <div class="timeline">
      <div class="lanes empty" id="lanes"></div>
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="controls">
      <div class="clock"><strong id="clockNow">0:00</strong> <span id="clockTotal">/ 0:00</span></div>
      <div class="transport">
        <button class="icon-btn skip" id="backBtn" type="button" title="Назад на 10 секунд" aria-label="Назад на 10 секунд">−10</button>
        <button class="play" id="playBtn" type="button" aria-label="Воспроизвести" title="Воспроизвести (пробел)">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="icon-btn skip" id="fwdBtn" type="button" title="Вперёд на 10 секунд" aria-label="Вперёд на 10 секунд">+10</button>
      </div>
      <div class="actions">
        <button class="btn" id="uploadBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 16V5m0 0-4.5 4.5M12 5l4.5 4.5M5 19h14"/></svg>
          Загрузить аудио
        </button>
        <input type="file" id="fileInput" accept="audio/*" multiple hidden>
      </div>
    </div>
  </section>

  <aside class="side" aria-label="Записи и каналы">
    <div class="filters">
      <div class="field">
        <label for="recSelect">Запись</label>
        <div class="field-row">
          <select id="recSelect"><option value="">Нет записей</option></select>
          <button class="btn square" id="refreshBtn" type="button" title="Обновить список с Plixus" aria-label="Обновить список с Plixus">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="chFilter">Канал</label>
        <select id="chFilter"><option value="-1">Все каналы</option></select>
      </div>
    </div>
    <ul class="channels" id="channels"></ul>
    <div class="side-nav">
      <button class="icon-btn" id="sidePrev" type="button" aria-label="Предыдущий канал">
        <svg viewBox="0 0 24 24"><path d="M20 12H5m0 0 6-6m-6 6 6 6"/></svg>
      </button>
      <p id="sideHint">Выберите канал</p>
      <button class="icon-btn" id="sideNext" type="button" aria-label="Следующий канал">
        <svg viewBox="0 0 24 24"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
      </button>
    </div>
  </aside>
</main>

<script>
// Адрес Plixus можно поменять в ссылке: plixus-player.html?host=10.0.20.32
const HOST = new URLSearchParams(location.search).get("host") || "10.0.20.32";
const WS_PORT = 6111;
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
const STAMP = /(\d{4})-(\d{2})-(\d{2})_(\d{2})h(\d{2})m(\d{2})s/;

const $ = id => document.getElementById(id);
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? h + ":" + String(m).padStart(2, "0") + ":" + sec : m + ":" + sec;
};

let ws = null;
let plixusFiles = { internal: [], external: [] };
let plixusSessions = [];
let localSessions = [];
let current = null;      // выбранная запись
let tracks = [];         // { label, color, el, error }
let filter = -1;         // индекс канала, который слышно; -1 = все
let playing = false;
let lastSync = 0;

/* ---------- Связь с Plixus: только чтение списка файлов ---------- */

function setConn(text, state) {
  $("conn").textContent = text;
  $("conn").dataset.state = state || "";
}

function send(module, name, data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ module, name, data: data ?? null }));
}

function requestFiles() {
  send("recording", "get_files", "internal");
  send("recording", "get_files", "external");
}

function connect() {
  setConn("Подключение к Plixus " + HOST + "…");
  try {
    ws = new WebSocket("ws://" + HOST + ":" + WS_PORT, "unicos-v2");
  } catch (e) {
    setConn("Не удалось подключиться к Plixus " + HOST, "error");
    return;
  }
  ws.onopen = () => {
    setConn("Plixus " + HOST, "ok");
    send("connection", "subscribe_modules", {
      client_id: "player",
      modules: [{ name: "connection", version: 0 }, { name: "recording", version: 0 }],
    });
    setTimeout(requestFiles, 300);
  };
  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.module === "recording" && msg.name === "files" && msg.data) {
      plixusFiles[msg.data.storage] = (msg.data.files || []).map(f => f.name);
      buildSessions();
    }
  };
  ws.onclose = () => {
    setConn("Нет связи с Plixus " + HOST + ", повтор через 5 с", "error");
    if (!plixusSessions.length) renderChannels();
    setTimeout(connect, 5000);
  };
}

setInterval(() => send("connection", "lfc"), 10000);

/* ---------- Записи: файлы с одним временем старта = одна запись ---------- */

function channelLabel(file, match) {
  let rest = match ? file.slice(match.index + match[0].length) : file;
  rest = rest.replace(/^[_\-\s]+/, "").replace(/\.[^.]+$/, "");
  return rest.replace(/^(\d+)-/, "$1 ") || file;
}

function buildSessions() {
  const map = new Map();
  for (const storage of ["internal", "external"]) {
    for (const path of plixusFiles[storage]) {
      const file = path.split("/").pop();
      const m = file.match(STAMP);
      const key = storage + ":" + (m ? m[0] : file);
      if (!map.has(key)) {
        const date = m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : null;
        map.set(key, {
          key,
          sort: m ? m[0] : "",
          title: (date ? date.toLocaleString("ru-RU") : file) + (storage === "external" ? " (внешний носитель)" : ""),
          files: [],
        });
      }
      map.get(key).files.push({
        url: "http://" + HOST + (path.startsWith("/") ? path : "/" + path),
        label: channelLabel(file, m),
      });
    }
  }
  plixusSessions = [...map.values()].sort((a, b) => b.sort.localeCompare(a.sort));
  plixusSessions.forEach(s => s.files.sort((a, b) =>
    (b.label === "Floor") - (a.label === "Floor") || a.label.localeCompare(b.label, "ru")));
  renderSessionSelect();
  const stillThere = current && allSessions().some(s => s.key === current.key);
  if (!stillThere) loadSession(allSessions()[0] || null);
}

const allSessions = () => [...localSessions, ...plixusSessions];

function renderSessionSelect() {
  const select = $("recSelect");
  select.innerHTML = "";
  if (!allSessions().length) select.add(new Option("Нет записей", ""));
  const group = (label, list) => {
    if (!list.length) return;
    const g = document.createElement("optgroup");
    g.label = label;
    list.forEach(s => g.append(new Option(s.title + " · " + s.files.length + " кан.", s.key)));
    select.append(g);
  };
  group("С компьютера", localSessions);
  group("Plixus " + HOST, plixusSessions);
  if (current) select.value = current.key;
}

function loadSession(session) {
  pause();
  tracks.forEach(t => { t.el.removeAttribute("src"); t.el.load(); });
  current = session;
  filter = -1;
  tracks = session ? session.files.map((f, i) => {
    const el = new Audio();
    el.preload = "auto";
    const track = { label: f.label, color: COLORS[i % COLORS.length], el, error: false };
    el.addEventListener("loadedmetadata", render);
    el.addEventListener("error", () => { track.error = true; render(); });
    el.addEventListener("ended", () => { if (tracks.every(t => t.error || t.el.ended || t.el.paused)) pause(); });
    el.src = f.url;
    return track;
  }) : [];
  if (session) $("recSelect").value = session.key;
  render();
}

/* ---------- Воспроизведение: все каналы идут вместе, лишние приглушены ---------- */

const okTracks = () => tracks.filter(t => !t.error);
const durationOf = t => (isFinite(t.el.duration) ? t.el.duration : 0);
const totalDuration = () => Math.max(0, ...okTracks().map(durationOf));
const master = () => okTracks().reduce((a, b) => (durationOf(b) > durationOf(a) ? b : a), okTracks()[0]);
const now = () => (master() ? master().el.currentTime : 0);

function applyMute() {
  tracks.forEach((t, i) => { t.el.muted = filter >= 0 && i !== filter; });
}

function play() {
  if (!okTracks().length) return;
  const t = now() >= totalDuration() - 0.05 ? 0 : now();
  applyMute();
  okTracks().forEach(tr => {
    if (t < durationOf(tr) || !durationOf(tr)) {
      tr.el.currentTime = t;
      tr.el.play().catch(() => {});
    }
  });
  playing = true;
  setPlayIcon();
  requestAnimationFrame(tick);
}

function pause() {
  tracks.forEach(t => t.el.pause());
  playing = false;
  setPlayIcon();
}

function seek(t) {
  t = Math.min(Math.max(0, t), totalDuration());
  okTracks().forEach(tr => {
    const d = durationOf(tr);
    tr.el.currentTime = d ? Math.min(t, d) : t;
    if (playing && t < d && tr.el.paused) tr.el.play().catch(() => {});
  });
  drawTime(t);
}

function tick(ts) {
  if (!playing) return;
  const t = now();
  if (ts - lastSync > 500) {
    lastSync = ts;
    okTracks().forEach(tr => {
      if (tr !== master() && !tr.el.ended && t < durationOf(tr) && Math.abs(tr.el.currentTime - t) > 0.2) tr.el.currentTime = t;
    });
  }
  drawTime(t);
  requestAnimationFrame(tick);
}

function setPlayIcon() {
  const label = playing ? "Пауза" : "Воспроизвести";
  $("playBtn").setAttribute("aria-label", label);
  $("playBtn").title = label + " (пробел)";
  $("playIcon").innerHTML = playing
    ? '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M8 5.5v13l11-6.5z"/>';
}

/* ---------- Отрисовка ---------- */

function drawTime(t) {
  const total = totalDuration();
  const head = document.querySelector(".playhead");
  if (head) head.style.left = (total ? t / total * 100 : 0) + "%";
  $("clockNow").textContent = fmt(t);
  $("clockTotal").textContent = "/ " + fmt(total);
  $("stageTime").textContent = current ? fmt(t) + " / " + fmt(total) : "";
}

function renderLanes() {
  const lanes = $("lanes");
  const total = totalDuration();
  lanes.innerHTML = "";
  lanes.classList.toggle("empty", !tracks.length);
  if (!tracks.length) {
    const p = document.createElement("div");
    p.className = "lane-empty";
    p.textContent = "Дорожки появятся, когда будет выбрана запись";
    lanes.append(p);
  }
  tracks.forEach((t, i) => {
    const lane = document.createElement("div");
    lane.className = "lane" + (filter >= 0 && i !== filter ? " dim" : "");
    lane.style.setProperty("--c", t.color);
    const name = document.createElement("span");
    name.className = "lane-name";
    name.textContent = t.label;
    name.title = t.label;
    const track = document.createElement("div");
    track.className = "lane-track";
    if (!t.error) {
      const bar = document.createElement("div");
      bar.className = "lane-bar";
      bar.style.width = (total && durationOf(t) ? durationOf(t) / total * 100 : 100) + "%";
      track.append(bar);
    }
    lane.append(name, track);
    lanes.append(lane);
  });
  const area = document.createElement("div");
  area.className = "playhead-area";
  area.innerHTML = '<div class="playhead"></div>';
  lanes.append(area);

  const ticks = $("ticks");
  ticks.innerHTML = "";
  if (total > 0) {
    const step = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].find(s => total / s <= 6) || 7200;
    for (let s = 0; s <= total; s += step) {
      const tick = document.createElement("span");
      tick.style.left = s / total * 100 + "%";
      tick.textContent = fmt(s);
      ticks.append(tick);
    }
  }
}

function renderChannels() {
  const list = $("channels");
  list.innerHTML = "";
  if (!tracks.length) {
    const p = document.createElement("li");
    p.className = "note";
    p.textContent = ws && ws.readyState === WebSocket.OPEN
      ? "На Plixus пока нет записей. Нажмите «Обновить» после записи или загрузите свои файлы."
      : "Нет связи с Plixus " + HOST + ". Плеер подключится сам, когда Plixus ответит. Можно загрузить свои файлы.";
    list.append(p);
    return;
  }
  tracks.forEach((t, i) => {
    const li = document.createElement("li");
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    row.style.setProperty("--c", t.color);
    row.setAttribute("aria-pressed", String(i === filter));
    row.title = i === filter ? "Вернуть все каналы" : "Слушать только этот канал";
    const name = document.createElement("b");
    name.textContent = t.label;
    let info;
    if (t.error) {
      info = document.createElement("small");
      info.textContent = "не загрузился";
    } else {
      info = document.createElement("time");
      info.textContent = durationOf(t) ? "0:00–" + fmt(durationOf(t)) : "…";
    }
    row.append(document.createElement("i"), name, info);
    row.addEventListener("click", () => {
      setFilter(i === filter ? -1 : i);
      if (!playing) play();
    });
    li.append(row);
    list.append(li);
  });
}

function render() {
  const select = $("chFilter");
  select.innerHTML = "";
  select.add(new Option("Все каналы", "-1"));
  tracks.forEach((t, i) => select.add(new Option(t.label, String(i))));
  select.value = String(filter);

  $("recTitle").textContent = current ? current.title : "Запись не выбрана";
  const active = tracks[filter];
  $("stageName").style.setProperty("--c", active ? active.color : "var(--muted)");
  $("stageName").lastElementChild.textContent = active ? active.label : "Все каналы";

  $("playBtn").disabled = !okTracks().length;
  $("backBtn").disabled = $("fwdBtn").disabled = !okTracks().length;
  $("sidePrev").disabled = filter <= 0;
  $("sideNext").disabled = filter < 0 || filter >= tracks.length - 1;
  $("sideHint").textContent = filter >= 0 ? "Канал " + (filter + 1) + " из " + tracks.length : "Выберите канал";

  renderLanes();
  renderChannels();
  drawTime(now());
}

function setFilter(i) {
  filter = i;
  applyMute();
  render();
}

/* ---------- Управление ---------- */

$("playBtn").addEventListener("click", () => (playing ? pause() : play()));
$("backBtn").addEventListener("click", () => seek(now() - 10));
$("fwdBtn").addEventListener("click", () => seek(now() + 10));
$("chFilter").addEventListener("change", e => setFilter(+e.target.value));
$("sidePrev").addEventListener("click", () => filter > 0 && setFilter(filter - 1));
$("sideNext").addEventListener("click", () => filter >= 0 && filter < tracks.length - 1 && setFilter(filter + 1));
$("recSelect").addEventListener("change", e => loadSession(allSessions().find(s => s.key === e.target.value) || null));
$("refreshBtn").addEventListener("click", () => {
  if (ws && ws.readyState === WebSocket.OPEN) requestFiles();
  else { try { ws && ws.close(); } catch {} }
});

$("uploadBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => {
  const files = [...e.target.files];
  e.target.value = "";
  if (!files.length) return;
  const session = {
    key: "local:" + Date.now(),
    sort: "",
    title: files.length === 1 ? files[0].name : "Свои файлы (" + files.length + ")",
    files: files.map(f => ({ url: URL.createObjectURL(f), label: f.name.replace(/\.[^.]+$/, "") })),
  };
  localSessions.unshift(session);
  renderSessionSelect();
  loadSession(session);
});

const lanesEl = $("lanes");
function seekFromPointer(e) {
  const area = lanesEl.querySelector(".playhead-area");
  if (!area || !tracks.length) return;
  const r = area.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * totalDuration());
}
lanesEl.addEventListener("pointerdown", e => {
  if (!tracks.length) return;
  lanesEl.setPointerCapture(e.pointerId);
  seekFromPointer(e);
});
lanesEl.addEventListener("pointermove", e => { if (lanesEl.hasPointerCapture(e.pointerId)) seekFromPointer(e); });

document.addEventListener("keydown", e => {
  if (e.code !== "Space" || /^(SELECT|INPUT|BUTTON)$/.test(e.target.tagName)) return;
  e.preventDefault();
  playing ? pause() : play();
});

render();
connect();
</script>
</body>
</html>
