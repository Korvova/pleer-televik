<title>Плеер микрофонов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Макет: рабочая область на весь экран, слева плеер, справа колонка меток. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --stage: #f4f6f9;
  --line: #d3dae3;
  --fg: #18212c;
  --muted: #5d6b7c;
  --hover: #edf1f6;
  --mic1: #d4412f;
  --mic2: #15935a;
  --mic3: #5a55d2;
  --rec: #d11f2e;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-time: "IBM Plex Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b;
    --panel: #171e27;
    --stage: #121820;
    --line: #2b3542;
    --fg: #e8edf3;
    --muted: #94a2b3;
    --hover: #212a35;
    --mic1: #f0705f;
    --mic2: #3dc486;
    --mic3: #9490f2;
    --rec: #f4505c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b;
  --panel: #171e27;
  --stage: #121820;
  --line: #2b3542;
  --fg: #e8edf3;
  --muted: #94a2b3;
  --hover: #212a35;
  --mic1: #f0705f;
  --mic2: #3dc486;
  --mic3: #9490f2;
  --rec: #f4505c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  margin: 0;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.app {
  height: 100%;
  min-height: 540px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

/* Плеер */
.player { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.stage {
  flex: 1;
  min-height: 240px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 48px 16px;
  background: var(--stage);
  text-align: center;
}
.stage-tag, .rec-badge { position: absolute; top: 14px; font-size: 13px; }
.stage-tag { left: 16px; color: var(--muted); }
.rec-badge { right: 16px; display: flex; align-items: center; gap: 7px; color: var(--rec); font-family: var(--font-time); font-weight: 500; }
.rec-badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); }
.stage-label { color: var(--muted); font-size: 13px; }
.stage-name { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 600; line-height: 1.15; }
.stage-name i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
.stage-range { font-family: var(--font-time); font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Дорожки */
.timeline { padding: 12px 16px 8px; border-top: 1px solid var(--line); }
.lanes { position: relative; display: grid; gap: 4px; padding-block: 3px; }
.lane { position: relative; height: 5px; background: var(--hover); border-radius: 1px; transition: opacity .15s; }
.lane.dim { opacity: .28; }
.seg { position: absolute; top: 0; bottom: 0; background: var(--c); border-radius: 1px; }
.playhead { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--fg); }
.ticks { position: relative; height: 18px; margin-top: 5px; font-family: var(--font-time); font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; }

/* Панель кнопок */
.controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  grid-template-areas: "time transport actions";
  align-items: center;
  gap: 12px 16px;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
}
.clock { grid-area: time; font-family: var(--font-time); font-variant-numeric: tabular-nums; }
.clock span { color: var(--muted); }
.transport { grid-area: transport; display: flex; align-items: center; gap: 12px; }
.actions { grid-area: actions; display: flex; justify-content: flex-end; gap: 8px; }

.icon-btn {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  background: none; border: 0; border-radius: 6px;
}
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn:disabled { color: var(--line); }
.play {
  width: 56px; height: 56px;
  display: grid; place-items: center;
  background: var(--fg); color: var(--panel);
  border: 0; border-radius: 50%;
}
.play svg { fill: currentColor; stroke: none; width: 26px; height: 26px; }

.btn {
  height: 40px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-size: 14px; font-weight: 500;
  white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn svg { width: 18px; height: 18px; }
.btn .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); }
.btn[aria-pressed="true"] { background: var(--rec); border-color: var(--rec); color: var(--panel); }
.btn[aria-pressed="true"] .dot { border-radius: 2px; background: var(--panel); }

/* Колонка меток */
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.filter { display: grid; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.filter label { font-size: 13px; color: var(--muted); }
.filter select { width: 100%; height: 40px; padding: 0 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.marks { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.row {
  width: 100%;
  display: grid;
  grid-template-columns: 112px 10px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  padding: 10px 8px;
  background: none; border: 0; border-radius: 4px;
  text-align: left;
}
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 600; }
.row time { font-family: var(--font-time); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }
.row i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.row b { font-weight: inherit; overflow-wrap: anywhere; }
.side-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.side-nav p { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 1080px) {
  .controls {
    grid-template-columns: auto 1fr;
    grid-template-areas: "transport transport" "time actions";
  }
  .transport { justify-self: center; }
}
@media (max-width: 760px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .player { border-right: 0; border-bottom: 1px solid var(--line); }
  .marks { overflow: visible; }
  .stage-name { font-size: 28px; }
}
@media (max-width: 480px) {
  .controls { grid-template-columns: minmax(0, 1fr); grid-template-areas: "transport" "time" "actions"; }
  .clock { text-align: center; }
  .actions .btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { .lane { transition: none; } }
</style>

<main class="app">
  <section class="player" aria-label="Плеер">
    <div class="stage">
      <span class="stage-tag">Пример данных</span>
      <span class="rec-badge" id="recBadge" hidden>Идёт запись</span>
      <span class="stage-label">Сейчас звучит</span>
      <div class="stage-name" id="stageName"><i></i><span></span></div>
      <div class="stage-range" id="stageRange"></div>
    </div>

    <div class="timeline">
      <div class="lanes" id="lanes"><div class="playhead" id="playhead"></div></div>
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="controls">
      <div class="clock"><strong id="clockNow"></strong> <span id="clockTotal"></span></div>
      <div class="transport">
        <button class="icon-btn" id="prevBtn" type="button" aria-label="Предыдущая метка" title="Предыдущая метка">
          <svg viewBox="0 0 24 24"><path d="M5 5v14M20 12H8m0 0 5-5m-5 5 5 5"/></svg>
        </button>
        <button class="play" id="playBtn" type="button" aria-label="Воспроизвести" title="Воспроизвести">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" type="button" aria-label="Следующая метка" title="Следующая метка">
          <svg viewBox="0 0 24 24"><path d="M19 5v14M4 12h12m0 0-5-5m5 5-5 5"/></svg>
        </button>
      </div>
      <div class="actions">
        <button class="btn" id="recBtn" type="button" aria-pressed="false"><span class="dot"></span><span id="recText">Запись</span></button>
        <button class="btn" id="uploadBtn" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 16V5m0 0-4.5 4.5M12 5l4.5 4.5M5 19h14"/></svg>
          Загрузить аудио
        </button>
      </div>
    </div>
  </section>

  <aside class="side" aria-label="Тайм-коды">
    <div class="filter">
      <label for="micFilter">Фильтр по микрофону</label>
      <select id="micFilter"><option value="">Все микрофоны</option></select>
    </div>
    <ul class="marks" id="marks"></ul>
    <div class="side-nav">
      <button class="icon-btn" id="sidePrev" type="button" aria-label="Предыдущая метка этого микрофона">
        <svg viewBox="0 0 24 24"><path d="M20 12H5m0 0 6-6m-6 6 6 6"/></svg>
      </button>
      <p id="sideHint"></p>
      <button class="icon-btn" id="sideNext" type="button" aria-label="Следующая метка этого микрофона">
        <svg viewBox="0 0 24 24"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
      </button>
    </div>
  </aside>
</main>

<script>
// Пример данных для вёрстки. Звука нет: кнопки только показывают состояния.
const DURATION = 135;
const MICS = [
  { id: "m1", name: "Владимир", color: "var(--mic1)" },
  { id: "m2", name: "Петр", color: "var(--mic2)" },
  { id: "m3", name: "Мик 2", color: "var(--mic3)" },
];
const MARKS = [
  { mic: "m1", start: 0, end: 15 },
  { mic: "m2", start: 32, end: 55 },
  { mic: "m3", start: 65, end: 75 },
  { mic: "m1", start: 80, end: 92 },
  { mic: "m2", start: 95, end: 104 },
  { mic: "m3", start: 101, end: 112 },
  { mic: "m1", start: 115, end: 128 },
];

const $ = id => document.getElementById(id);
const micOf = mark => MICS.find(m => m.id === mark.mic);
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const pct = s => (s / DURATION * 100) + "%";

let filter = "";
let selected = MARKS[1];

MICS.forEach(mic => {
  const option = new Option(mic.name + " (" + MARKS.filter(m => m.mic === mic.id).length + ")", mic.id);
  $("micFilter").add(option);

  const lane = document.createElement("div");
  lane.className = "lane";
  lane.dataset.mic = mic.id;
  lane.style.setProperty("--c", mic.color);
  MARKS.filter(m => m.mic === mic.id).forEach(mark => {
    const seg = document.createElement("div");
    seg.className = "seg";
    seg.style.left = pct(mark.start);
    seg.style.width = pct(mark.end - mark.start);
    lane.append(seg);
  });
  $("lanes").insertBefore(lane, $("playhead"));
});

[0, 30, 60, 90, 120].forEach(s => {
  const tick = document.createElement("span");
  tick.style.left = pct(s);
  tick.textContent = fmt(s);
  $("ticks").append(tick);
});

const rows = MARKS.map(mark => {
  const li = document.createElement("li");
  const row = document.createElement("button");
  const time = document.createElement("time");
  const name = document.createElement("b");
  row.type = "button";
  row.className = "row";
  row.style.setProperty("--c", micOf(mark).color);
  time.textContent = fmt(mark.start) + "–" + fmt(mark.end);
  name.textContent = micOf(mark).name;
  row.append(time, document.createElement("i"), name);
  row.addEventListener("click", () => { selected = mark; update(); });
  li.append(row);
  $("marks").append(li);
  return { mark, li, row };
});

const visible = () => MARKS.filter(m => !filter || m.mic === filter);

function step(dir) {
  const list = visible();
  const next = list[list.indexOf(selected) + dir];
  if (next) { selected = next; update(); }
}

function update() {
  const list = visible();
  if (!list.includes(selected)) selected = list[0];
  const index = list.indexOf(selected);
  const mic = micOf(selected);

  rows.forEach(({ mark, li, row }) => {
    li.hidden = !list.includes(mark);
    if (mark === selected) row.setAttribute("aria-current", "true");
    else row.removeAttribute("aria-current");
  });
  document.querySelectorAll(".lane").forEach(lane => {
    lane.classList.toggle("dim", !!filter && lane.dataset.mic !== filter);
  });

  $("stageName").style.setProperty("--c", mic.color);
  $("stageName").lastElementChild.textContent = mic.name;
  $("stageRange").textContent = fmt(selected.start) + "–" + fmt(selected.end);
  $("playhead").style.left = pct(selected.start);
  $("clockNow").textContent = fmt(selected.start);
  $("clockTotal").textContent = "/ " + fmt(DURATION);

  $("prevBtn").disabled = index === 0;
  $("nextBtn").disabled = index === list.length - 1;
  $("sidePrev").disabled = !filter || index === 0;
  $("sideNext").disabled = !filter || index === list.length - 1;
  $("sideHint").textContent = filter ? (index + 1) + " из " + list.length : "Выберите микрофон";
}

$("micFilter").addEventListener("change", e => { filter = e.target.value; update(); });
$("prevBtn").addEventListener("click", () => step(-1));
$("nextBtn").addEventListener("click", () => step(1));
$("sidePrev").addEventListener("click", () => step(-1));
$("sideNext").addEventListener("click", () => step(1));

$("playBtn").addEventListener("click", () => {
  const playing = $("playBtn").getAttribute("aria-label") === "Пауза";
  const label = playing ? "Воспроизвести" : "Пауза";
  $("playBtn").setAttribute("aria-label", label);
  $("playBtn").title = label;
  $("playIcon").innerHTML = playing
    ? '<path d="M8 5.5v13l11-6.5z"/>'
    : '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>';
});

$("recBtn").addEventListener("click", () => {
  const on = $("recBtn").getAttribute("aria-pressed") !== "true";
  $("recBtn").setAttribute("aria-pressed", String(on));
  $("recText").textContent = on ? "Остановить" : "Запись";
  $("recBadge").hidden = !on;
});

update();
</script>
