<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плеер Plixus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Макет: слева плеер с дорожками каналов и микрофонов, справа запись, выбор записи и метки. */
:root {
  --bg: #e9edf2;
  --panel: #ffffff;
  --stage: #f4f6f9;
  --line: #d3dae3;
  --fg: #18212c;
  --muted: #5d6b7c;
  --hover: #edf1f6;
  --rec: #d11f2e;
  --ok: #15935a;
  --c1: #2f6fd6;
  --c2: #d4412f;
  --c3: #15935a;
  --c4: #5a55d2;
  --c5: #b9800f;
  --c6: #1b8ca6;
  --c7: #c2417f;
  --c8: #6b7d2a;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-time: "IBM Plex Mono", Consolas, monospace;
  --lw: 72px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141b;
    --panel: #171e27;
    --stage: #121820;
    --line: #2b3542;
    --fg: #e8edf3;
    --muted: #94a2b3;
    --hover: #212a35;
    --rec: #f4505c;
    --ok: #3dc486;
    --c1: #6b9cf0;
    --c2: #f0705f;
    --c3: #3dc486;
    --c4: #9490f2;
    --c5: #e0aa3e;
    --c6: #4cbcd6;
    --c7: #ec79b0;
    --c8: #a8bd5a;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; padding: 16px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
svg { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

.app {
  height: 100%;
  min-height: 600px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}

/* Плеер */
.player { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
.stage {
  flex: 1; min-height: 220px; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: 52px 16px 40px; background: var(--stage); text-align: center;
}
.conn { position: absolute; top: 14px; left: 16px; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn[data-state="ok"]::before { background: var(--ok); }
.conn[data-state="error"] { color: var(--rec); }
.conn[data-state="error"]::before { background: var(--rec); }
.rec-badge { position: absolute; top: 14px; right: 16px; display: flex; align-items: center; gap: 7px; color: var(--rec); font-family: var(--font-time); font-size: 13px; font-weight: 500; }
.rec-badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.stage-label { color: var(--muted); font-size: 14px; }
.stage-name { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 600; line-height: 1.15; }
.stage-name i { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--muted)); }
.stage-time { font-family: var(--font-time); font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage-speaker { position: absolute; bottom: 14px; left: 16px; right: 16px; font-size: 14px; color: var(--muted); }

/* Дорожки */
.timeline { padding: 14px 16px 8px; border-top: 1px solid var(--line); }
.lanes { position: relative; display: grid; gap: 6px; cursor: pointer; touch-action: none; user-select: none; }
.lanes.empty { cursor: default; }
.lane { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr); gap: 10px; align-items: center; transition: opacity .15s; }
.lane.dim { opacity: .3; }
.lane.sep { margin-top: 4px; }
.lane-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-track { position: relative; height: 8px; background: var(--hover); border-radius: 2px; }
.lane.mic .lane-track { height: 5px; }
.lane-bar { position: absolute; top: 0; bottom: 0; background: var(--c); border-radius: 2px; min-width: 2px; }
.lane-empty { font-size: 13px; color: var(--muted); padding: 4px 0 4px calc(var(--lw) + 10px); }
.playhead-area { position: absolute; top: -4px; bottom: -4px; left: calc(var(--lw) + 10px); right: 0; pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); }
.ticks { position: relative; height: 18px; margin: 6px 0 0 calc(var(--lw) + 10px); font-family: var(--font-time); font-size: 11px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }

/* Панель кнопок */
.controls {
  display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "time transport actions";
  align-items: center; gap: 12px 16px; padding: 12px 16px; border-top: 1px solid var(--line);
}
.clock { grid-area: time; font-family: var(--font-time); font-variant-numeric: tabular-nums; }
.clock span { color: var(--muted); }
.transport { grid-area: transport; display: flex; align-items: center; gap: 6px; }
.actions { grid-area: actions; display: flex; justify-content: flex-end; gap: 8px; }
.icon-btn { min-width: 44px; height: 44px; display: grid; place-items: center; padding: 0 6px; background: none; border: 0; border-radius: 6px; }
.icon-btn:hover:not(:disabled) { background: var(--hover); }
.icon-btn:disabled { color: var(--line); }
.skip { font-family: var(--font-time); font-size: 14px; font-weight: 500; }
.play { width: 56px; height: 56px; margin: 0 6px; display: grid; place-items: center; background: var(--fg); color: var(--panel); border: 0; border-radius: 50%; }
.play:disabled { opacity: .35; }
.play svg { fill: currentColor; stroke: none; width: 26px; height: 26px; }
.btn {
  height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 14px; font-weight: 500; white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .5; }
.btn svg { width: 18px; height: 18px; }

/* Колонка справа */
.side { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.block { display: grid; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.block h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.field select, .field input { width: 100%; min-width: 0; height: 40px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.square { width: 40px; padding: 0; }
.rec-btn .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); }
.rec-btn[data-on="true"] { background: var(--rec); border-color: var(--rec); color: var(--panel); }
.rec-btn[data-on="true"] .dot { border-radius: 2px; background: var(--panel); }
.rec-status { margin: 0; font-size: 13px; color: var(--muted); min-height: 18px; }
.rec-status.err { color: var(--rec); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { height: 32px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; font-size: 13px; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--fg)) 16%, transparent); border-color: var(--c, var(--fg)); font-weight: 600; }
.marks { flex: 1; min-height: 0; overflow-y: auto; list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.row {
  width: 100%; display: grid; grid-template-columns: 112px 10px minmax(0, 1fr); align-items: center; gap: 8px;
  padding: 10px 8px; background: none; border: 0; border-radius: 4px; text-align: left;
}
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--c) 16%, transparent); font-weight: 600; }
.row time { font-family: var(--font-time); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }
.row i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.row b { font-weight: inherit; overflow-wrap: anywhere; }
.note { margin: 0; padding: 12px 8px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.side-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
.side-nav p { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 1120px) {
  .controls { grid-template-columns: auto 1fr; grid-template-areas: "transport transport" "time actions"; }
  .transport { justify-self: center; }
}
@media (max-width: 800px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .player { border-right: 0; border-bottom: 1px solid var(--line); }
  .marks { overflow: visible; }
  .stage-name { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) { .lane { transition: none; } .rec-badge::before { animation: none; } }
</style>
</head>
<body>
<main class="app">
  <section class="player" aria-label="Плеер">
    <div class="stage">
      <span class="conn" id="conn">Подключение к программе…</span>
      <span class="rec-badge" id="recBadge" hidden></span>
      <span class="stage-label" id="recTitle">Запись не выбрана</span>
      <div class="stage-name" id="stageName"><i></i><span>Все каналы</span></div>
      <div class="stage-time" id="stageTime"></div>
      <div class="stage-speaker" id="stageSpeaker"></div>
    </div>

    <div class="timeline">
      <div class="lanes empty" id="lanes"></div>
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="controls">
      <div class="clock"><strong id="clockNow">0:00</strong> <span id="clockTotal">/ 0:00</span></div>
      <div class="transport">
        <button class="icon-btn skip" id="backBtn" type="button" title="Назад на 10 секунд" aria-label="Назад на 10 секунд">−10</button>
        <button class="icon-btn" id="prevBtn" type="button" title="Предыдущая метка" aria-label="Предыдущая метка">
          <svg viewBox="0 0 24 24"><path d="M5 5v14M20 12H8m0 0 5-5m-5 5 5 5"/></svg>
        </button>
        <button class="play" id="playBtn" type="button" aria-label="Воспроизвести" title="Воспроизвести (пробел)">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" type="button" title="Следующая метка" aria-label="Следующая метка">
          <svg viewBox="0 0 24 24"><path d="M19 5v14M4 12h12m0 0-5-5m5 5-5 5"/></svg>
        </button>
        <button class="icon-btn skip" id="fwdBtn" type="button" title="Вперёд на 10 секунд" aria-label="Вперёд на 10 секунд">+10</button>
      </div>
      <div class="actions">
        <button class="btn" id="uploadBtn" type="button" title="Открыть аудиофайлы с компьютера. Чтобы были метки, выделите в папке записи все файлы вместе с meta.json">
          <svg viewBox="0 0 24 24"><path d="M12 16V5m0 0-4.5 4.5M12 5l4.5 4.5M5 19h14"/></svg>
          Загрузить аудио
        </button>
        <input type="file" id="fileInput" accept="audio/*,.json,application/json" multiple hidden>
      </div>
    </div>
  </section>

  <aside class="side" aria-label="Запись, записи и метки">
    <div class="block">
      <h2>Запись на Plixus</h2>
      <div class="field">
        <label for="recName">Название</label>
        <div class="field-row">
          <input id="recName" type="text" maxlength="80" placeholder="Например, Совет 17.11" autocomplete="off">
          <button class="btn rec-btn" id="recBtn" type="button" data-on="false"><span class="dot"></span><span id="recBtnText">Запись</span></button>
        </div>
      </div>
      <p class="rec-status" id="recStatus"></p>
    </div>
    <div class="block">
      <div class="field">
        <label for="recSelect">Запись для прослушивания</label>
        <div class="field-row">
          <select id="recSelect"><option value="">Нет записей</option></select>
          <button class="btn square" id="refreshBtn" type="button" title="Скачать новые записи с Plixus" aria-label="Скачать новые записи с Plixus">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label>Слушать канал</label>
        <div class="chips" id="chips"></div>
      </div>
      <div class="field">
        <label for="micFilter">Фильтр по микрофону</label>
        <select id="micFilter"><option value="">Все микрофоны</option></select>
      </div>
    </div>
    <ul class="marks" id="marks"></ul>
    <div class="side-nav">
      <button class="icon-btn" id="sidePrev" type="button" aria-label="Предыдущая метка этого микрофона">
        <svg viewBox="0 0 24 24"><path d="M20 12H5m0 0 6-6m-6 6 6 6"/></svg>
      </button>
      <p id="sideHint">Выберите микрофон</p>
      <button class="icon-btn" id="sideNext" type="button" aria-label="Следующая метка этого микрофона">
        <svg viewBox="0 0 24 24"><path d="M4 12h15m0 0-6-6m6 6-6 6"/></svg>
      </button>
    </div>
  </aside>
</main>

<script>
const COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
const MIC_COLORS = ["var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)", "var(--c2)", "var(--c3)", "var(--c1)"];
const $ = id => document.getElementById(id);
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = String(s % 60).padStart(2, "0");
  return h ? h + ":" + String(m).padStart(2, "0") + ":" + sec : m + ":" + sec;
};

let recordings = [];     // записи из папок на компьютере
let localSessions = [];  // файлы, открытые кнопкой «Загрузить аудио»
let current = null;
let tracks = [];         // { label, color, el, error }
let marks = [];          // { seat, label, start, end, color }
let channel = -1;        // какой канал слышно; -1 = все
let mic = "";            // фильтр меток по микрофону
let playing = false;
let lastSync = 0;
let status = null;
let seenVersion = -1;
let busy = false;

/* ---------- Программа на компьютере ---------- */

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || "Программа не ответила");
  return data;
}

async function pollStatus() {
  try {
    status = await api("/api/status");
    if (status.version !== seenVersion) {
      seenVersion = status.version;
      await loadRecordings();
    }
  } catch {
    status = null;
  }
  renderStatus();
  setTimeout(pollStatus, 1000);
}

async function loadRecordings() {
  recordings = await api("/api/recordings");
  renderSessionSelect();
  const all = allSessions();
  const same = current && all.find(s => s.id === current.id);
  if (same && current.marks.length !== (same.marks || []).length) { current.marks = same.marks; setupMarks(); render(); }
  if (!same) loadSession(all[0] || null);
}

function renderStatus() {
  const conn = $("conn");
  if (location.protocol === "file:") {
    conn.textContent = "Этот файл не открывают напрямую: запустите «Запустить.bat», плеер откроется сам на http://localhost:8765";
    conn.dataset.state = "error";
  } else if (!status) {
    conn.textContent = "Программа записи не запущена: откройте «Запустить.bat»";
    conn.dataset.state = "error";
  } else if (!status.plixus) {
    conn.textContent = "Нет связи с Plixus " + status.host + ", пробую снова";
    conn.dataset.state = "error";
  } else {
    conn.textContent = "Plixus " + status.host;
    conn.dataset.state = "ok";
  }

  const recording = status && (status.state === "active" || status.state === "paused");
  $("recBadge").hidden = !recording;
  if (recording) {
    $("recBadge").textContent = (status.state === "paused" ? "Пауза " : "Идёт запись ") + fmt(status.elapsed || 0)
      + (status.name ? " · " + status.name : "");
  }
  const live = status && status.live.length ? "Сейчас говорит: " + status.live.map(l => l.label).join(", ") : "";
  $("stageSpeaker").textContent = recording ? live : "";

  const btn = $("recBtn");
  btn.dataset.on = String(!!recording);
  $("recBtnText").textContent = recording ? "Стоп" : "Запись";
  btn.disabled = busy || !status || !status.plixus;
  $("recName").disabled = !!recording || busy;
  $("refreshBtn").disabled = !status || !status.plixus;

  const line = $("recStatus");
  line.classList.toggle("err", !!(status && status.error));
  if (!status) line.textContent = "";
  else if (status.error) line.textContent = status.error;
  else if (recording) line.textContent = "Пишется на Plixus. После «Стоп» файлы скачаются сами.";
  else if (status.sync) line.textContent = status.sync;
  else line.textContent = "Записи сохраняются в " + status.folder;
}

$("recBtn").addEventListener("click", async () => {
  const recording = status && (status.state === "active" || status.state === "paused");
  busy = true;
  renderStatus();
  try {
    if (recording) await api("/api/stop", {});
    else await api("/api/start", { name: $("recName").value.trim() });
    if (status) status.error = "";
  } catch (e) {
    if (status) status.error = e.message;
  }
  busy = false;
  renderStatus();
});

$("refreshBtn").addEventListener("click", () => api("/api/sync", {}).catch(() => {}));

/* ---------- Выбор записи ---------- */

const allSessions = () => [...localSessions, ...recordings];

function renderSessionSelect() {
  const select = $("recSelect");
  select.innerHTML = "";
  if (!allSessions().length) select.add(new Option("Нет записей", ""));
  const group = (label, list) => {
    if (!list.length) return;
    const g = document.createElement("optgroup");
    g.label = label;
    list.forEach(s => g.append(new Option(s.title, s.id)));
    select.append(g);
  };
  group("С компьютера", localSessions);
  group("Записи Plixus", recordings);
  if (current) select.value = current.id;
}

function setupMarks() {
  const seats = [...new Set((current?.marks || []).map(m => String(m.seat)))].sort((a, b) => a - b);
  marks = (current?.marks || []).map(m => ({ ...m, seat: String(m.seat), color: MIC_COLORS[seats.indexOf(String(m.seat)) % MIC_COLORS.length] }))
    .sort((a, b) => a.start - b.start);
  if (mic && !seats.includes(mic)) mic = "";
}

function loadSession(session) {
  pause();
  tracks.forEach(t => { t.el.removeAttribute("src"); t.el.load(); });
  current = session ? { ...session, marks: session.marks || [] } : null;
  channel = -1;
  mic = "";
  tracks = current ? current.channels.map((c, i) => {
    const el = new Audio();
    el.preload = "auto";
    const track = { label: c.label, color: COLORS[i % COLORS.length], el, error: false };
    el.addEventListener("loadedmetadata", render);
    el.addEventListener("error", () => { track.error = true; render(); });
    el.addEventListener("ended", () => { if (tracks.every(t => t.error || t.el.ended || t.el.paused)) pause(); });
    el.src = c.url;
    return track;
  }) : [];
  setupMarks();
  if (current) $("recSelect").value = current.id;
  render();
}

/* ---------- Воспроизведение ---------- */

const okTracks = () => tracks.filter(t => !t.error);
const durationOf = t => (isFinite(t.el.duration) ? t.el.duration : 0);
const totalDuration = () => Math.max(0, ...okTracks().map(durationOf));
const master = () => okTracks().reduce((a, b) => (durationOf(b) > durationOf(a) ? b : a), okTracks()[0]);
const now = () => (master() ? master().el.currentTime : 0);

function applyMute() { tracks.forEach((t, i) => { t.el.muted = channel >= 0 && i !== channel; }); }

function play() {
  if (!okTracks().length) return;
  const t = now() >= totalDuration() - 0.05 ? 0 : now();
  applyMute();
  okTracks().forEach(tr => {
    if (t < durationOf(tr) || !durationOf(tr)) { tr.el.currentTime = t; tr.el.play().catch(() => {}); }
  });
  playing = true;
  setPlayIcon();
  requestAnimationFrame(tick);
}

function pause() {
  tracks.forEach(t => t.el.pause());
  playing = false;
  setPlayIcon();
}

function seek(t) {
  t = Math.min(Math.max(0, t), totalDuration());
  okTracks().forEach(tr => {
    const d = durationOf(tr);
    tr.el.currentTime = d ? Math.min(t, d) : t;
    if (playing && t < d && tr.el.paused) tr.el.play().catch(() => {});
  });
  drawTime(t);
}

function tick(ts) {
  if (!playing) return;
  const t = now();
  if (ts - lastSync > 500) {
    lastSync = ts;
    okTracks().forEach(tr => {
      if (tr !== master() && !tr.el.ended && t < durationOf(tr) && Math.abs(tr.el.currentTime - t) > 0.2) tr.el.currentTime = t;
    });
  }
  drawTime(t);
  requestAnimationFrame(tick);
}

function setPlayIcon() {
  const label = playing ? "Пауза" : "Воспроизвести";
  $("playBtn").setAttribute("aria-label", label);
  $("playBtn").title = label + " (пробел)";
  $("playIcon").innerHTML = playing
    ? '<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M8 5.5v13l11-6.5z"/>';
}

/* ---------- Метки ---------- */

const visibleMarks = () => marks.filter(m => !mic || m.seat === mic);

function jumpMark(dir, list = visibleMarks()) {
  const t = now();
  const target = dir > 0 ? list.find(m => m.start > t + 0.3) : [...list].reverse().find(m => m.start < t - 1.5);
  if (target) { seek(target.start); render(); }
}

/* ---------- Отрисовка ---------- */

let liveKey = "";
function drawTime(t) {
  const total = totalDuration();
  const head = document.querySelector(".playhead");
  if (head) head.style.left = (total ? t / total * 100 : 0) + "%";
  $("clockNow").textContent = fmt(t);
  $("clockTotal").textContent = "/ " + fmt(total);
  $("stageTime").textContent = current ? fmt(t) + " / " + fmt(total) : "";
  const key = visibleMarks().filter(m => m.start <= t && t < m.end).map(m => marks.indexOf(m)).join(",");
  if (key !== liveKey) {
    liveKey = key;
    document.querySelectorAll(".row").forEach(row => {
      const on = key.split(",").includes(row.dataset.i);
      if (on) row.setAttribute("aria-current", "true"); else row.removeAttribute("aria-current");
    });
  }
  updateNav();
}

function updateNav() {
  const t = now();
  const list = visibleMarks();
  const hasNext = list.some(m => m.start > t + 0.3);
  const hasPrev = list.some(m => m.start < t - 1.5);
  $("prevBtn").disabled = !hasPrev;
  $("nextBtn").disabled = !hasNext;
  $("sidePrev").disabled = !mic || !hasPrev;
  $("sideNext").disabled = !mic || !hasNext;
}

function renderLanes() {
  const lanes = $("lanes");
  const total = totalDuration();
  lanes.innerHTML = "";
  lanes.classList.toggle("empty", !tracks.length);
  if (!tracks.length) {
    const p = document.createElement("div");
    p.className = "lane-empty";
    p.textContent = "Дорожки появятся, когда будет выбрана запись";
    lanes.append(p);
  }
  const addLane = (label, color, cls, bars) => {
    const lane = document.createElement("div");
    lane.className = "lane " + cls;
    lane.style.setProperty("--c", color);
    const name = document.createElement("span");
    name.className = "lane-name";
    name.textContent = name.title = label;
    const track = document.createElement("div");
    track.className = "lane-track";
    bars.forEach(([a, b]) => {
      const bar = document.createElement("div");
      bar.className = "lane-bar";
      bar.style.left = (total ? a / total * 100 : 0) + "%";
      bar.style.width = (total ? (b - a) / total * 100 : 100) + "%";
      track.append(bar);
    });
    lane.append(name, track);
    lanes.append(lane);
  };
  tracks.forEach((t, i) => addLane(t.label, t.color, channel >= 0 && i !== channel ? "dim" : "",
    t.error ? [] : [[0, durationOf(t) || total]]));
  const seats = [...new Set(marks.map(m => m.seat))].sort((x, y) => x - y);
  seats.forEach((seat, n) => {
    const own = marks.filter(m => m.seat === seat);
    addLane(own[0].label, own[0].color, "mic" + (n === 0 ? " sep" : "") + (mic && mic !== seat ? " dim" : ""),
      total ? own.map(m => [m.start, Math.min(m.end, total)]) : []);
  });
  const area = document.createElement("div");
  area.className = "playhead-area";
  area.innerHTML = '<div class="playhead"></div>';
  lanes.append(area);

  const ticks = $("ticks");
  ticks.innerHTML = "";
  if (total > 0) {
    const step = [5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].find(s => total / s <= 6) || 7200;
    for (let s = 0; s <= total; s += step) {
      const tick = document.createElement("span");
      tick.style.left = s / total * 100 + "%";
      tick.textContent = fmt(s);
      ticks.append(tick);
    }
  }
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  if (!tracks.length) { box.textContent = "—"; return; }
  const add = (label, i, color) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    if (color) b.style.setProperty("--c", color);
    b.setAttribute("aria-pressed", String(channel === i));
    b.append(document.createElement("i"), label);
    b.addEventListener("click", () => { channel = i; applyMute(); render(); });
    box.append(b);
  };
  add("Все", -1, null);
  tracks.forEach((t, i) => add(t.label + (t.error ? " (не загрузился)" : ""), i, t.color));
}

function renderMarks() {
  const select = $("micFilter");
  select.innerHTML = "";
  select.add(new Option("Все микрофоны", ""));
  [...new Map(marks.map(m => [m.seat, m.label])).entries()].sort((x, y) => x[0] - y[0]).forEach(([seat, label]) =>
    select.add(new Option(label + " (" + marks.filter(m => m.seat === seat).length + ")", seat)));
  select.value = mic;
  select.disabled = !marks.length;

  const list = $("marks");
  list.innerHTML = "";
  if (!current) {
    const li = document.createElement("li");
    li.className = "note";
    li.textContent = "Записей пока нет. Запустите запись кнопкой справа сверху или откройте свои файлы.";
    list.append(li);
    return;
  }
  if (!marks.length) {
    const li = document.createElement("li");
    li.className = "note";
    li.textContent = "Для этой записи нет меток микрофонов. Метки появляются, если во время записи была запущена программа.";
    list.append(li);
    return;
  }
  visibleMarks().forEach(m => {
    const li = document.createElement("li");
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row";
    row.dataset.i = marks.indexOf(m);
    row.style.setProperty("--c", m.color);
    const time = document.createElement("time");
    time.textContent = fmt(m.start) + "–" + fmt(m.end);
    const name = document.createElement("b");
    name.textContent = m.label;
    row.append(time, document.createElement("i"), name);
    row.addEventListener("click", () => { seek(m.start); if (!playing) play(); });
    li.append(row);
    list.append(li);
  });
  const n = visibleMarks().length;
  $("sideHint").textContent = mic ? n + " " + (n === 1 ? "метка" : n < 5 ? "метки" : "меток") : "Выберите микрофон";
}

function render() {
  $("recTitle").textContent = current ? current.title : "Запись не выбрана";
  const active = tracks[channel];
  $("stageName").style.setProperty("--c", active ? active.color : "var(--muted)");
  $("stageName").lastElementChild.textContent = active ? active.label : "Все каналы";
  $("playBtn").disabled = $("backBtn").disabled = $("fwdBtn").disabled = !okTracks().length;
  if (!mic) $("sideHint").textContent = "Выберите микрофон";
  renderLanes();
  renderChips();
  renderMarks();
  liveKey = null;
  drawTime(now());
}

/* ---------- Управление ---------- */

$("playBtn").addEventListener("click", () => (playing ? pause() : play()));
$("backBtn").addEventListener("click", () => seek(now() - 10));
$("fwdBtn").addEventListener("click", () => seek(now() + 10));
$("prevBtn").addEventListener("click", () => jumpMark(-1));
$("nextBtn").addEventListener("click", () => jumpMark(1));
$("sidePrev").addEventListener("click", () => jumpMark(-1));
$("sideNext").addEventListener("click", () => jumpMark(1));
$("micFilter").addEventListener("change", e => { mic = e.target.value; render(); });
$("recSelect").addEventListener("change", e => loadSession(allSessions().find(s => s.id === e.target.value) || null));

$("uploadBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", async e => {
  const picked = [...e.target.files];
  e.target.value = "";
  const isMeta = f => /\.json$/i.test(f.name);
  const audio = picked.filter(f => !isMeta(f));
  if (!audio.length) {
    if (picked.length) $("recStatus").textContent = "Выберите вместе с meta.json и сами аудиофайлы записи";
    return;
  }
  // meta.json из папки записи: название, подписи каналов и метки микрофонов
  let meta = null;
  const metaFile = picked.find(f => f.name.toLowerCase() === "meta.json") || picked.find(isMeta);
  if (metaFile) {
    try { meta = JSON.parse(await metaFile.text()); } catch { meta = null; }
  }
  const metaChannels = (meta && Array.isArray(meta.channels)) ? meta.channels : [];
  const order = f => {
    const i = metaChannels.findIndex(c => c.file === f.name);
    return i < 0 ? metaChannels.length : i;
  };
  audio.sort((a, b) => order(a) - order(b) || a.name.localeCompare(b.name, "ru"));
  const marksOk = meta && Array.isArray(meta.marks) ? meta.marks.filter(m => isFinite(m.start) && isFinite(m.end)) : [];
  const title = (meta && (meta.name || meta.stamp)) ||
    (audio.length === 1 ? audio[0].name : "Свои файлы (" + audio.length + ")");
  const session = {
    id: "local:" + Date.now(),
    title: title + (marksOk.length ? " · меток: " + marksOk.length : ""),
    channels: audio.map(f => {
      const c = metaChannels.find(x => x.file === f.name);
      return { url: URL.createObjectURL(f), label: c ? c.label : f.name.replace(/\.[^.]+$/, "") };
    }),
    marks: marksOk.map(m => ({ seat: m.seat, label: m.label || "Мик " + m.seat, start: +m.start, end: +m.end })),
  };
  localSessions.unshift(session);
  renderSessionSelect();
  loadSession(session);
});

const lanesEl = $("lanes");
function seekFromPointer(e) {
  const area = lanesEl.querySelector(".playhead-area");
  if (!area || !tracks.length) return;
  const r = area.getBoundingClientRect();
  seek((e.clientX - r.left) / r.width * totalDuration());
}
lanesEl.addEventListener("pointerdown", e => {
  if (!tracks.length) return;
  lanesEl.setPointerCapture(e.pointerId);
  seekFromPointer(e);
});
lanesEl.addEventListener("pointermove", e => { if (lanesEl.hasPointerCapture(e.pointerId)) seekFromPointer(e); });

document.addEventListener("keydown", e => {
  if (e.code !== "Space" || /^(SELECT|INPUT|BUTTON)$/.test(e.target.tagName)) return;
  e.preventDefault();
  playing ? pause() : play();
});

render();
pollStatus();
</script>
</body>
</html>
